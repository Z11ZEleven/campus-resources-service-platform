name: Public layer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-password
          MYSQL_DATABASE: campus_resources_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:ci-test-only-password@127.0.0.1:3306/campus_resources_test
      JWT_SIGNING_KEY: ci-only-signing-key-at-least-32-characters
      MYSQL_PASSWORD: ci-test-only-password
      MYSQL_USER: root
      MYSQL_DATABASE: campus_resources_test
      M3_TIMEOUT_SCAN_ENABLED: "false"
      RUN_BROWSER_E2E: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix ../frontend ci
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check app scripts tests alembic
      - run: python -m pytest --require-mysql -q
      - run: python -m alembic check

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  delivery-images:
    runs-on: ubuntu-latest
    needs: [backend-mysql, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t campus-backend:${{ github.sha }} backend
      - run: docker build -t campus-web:${{ github.sha }} frontend
      - name: Validate application deployment configuration
        env:
          MYSQL_PASSWORD: ci-only-compose-password
          MYSQL_ROOT_PASSWORD: ci-only-compose-root-password
          JWT_SIGNING_KEY: ci-only-compose-key-at-least-32-characters
          M1_CHECKIN_SECRET: ci-only-checkin-key-at-least-32-characters
          RELEASE_VERSION: ${{ github.sha }}
        run: docker compose -f deploy/compose.yml -f deploy/compose.app.yml config --quiet
