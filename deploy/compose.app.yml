# Overlay: docker compose -f deploy/compose.yml -f deploy/compose.app.yml ...
x-backend: &backend
  image: campus-backend:${RELEASE_VERSION:?Set RELEASE_VERSION to a reviewed SHA or tag}
  build: ../backend
  environment: &environment
    MYSQL_HOST: mysql
    MYSQL_PORT: 3306
    MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_resources}
    MYSQL_USER: ${MYSQL_USER:-campus_app}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
    M1_CHECKIN_SECRET: ${M1_CHECKIN_SECRET:?Set M1_CHECKIN_SECRET}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    M3_TIMEOUT_SCAN_ENABLED: "false"
services:
  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
  api:
    <<: *backend
    environment:
      <<: *environment
      M3_TIMEOUT_SCAN_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s
  web:
    image: campus-web:${RELEASE_VERSION:?Set RELEASE_VERSION}
    build: ../frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
